[project]
name = "noidea"
version = "1.2.0"
description = "AI commit messages that pre-fill your git editor. Works with Claude, GPT, Gemini or local Ollama models, follows Conventional Commits, and learns your repo's style."
authors = [
    {name = "AccursedGalaxy",email = "robinbohrer7@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "git",
    "commit",
    "commit-message",
    "commit-message-generator",
    "conventional-commits",
    "ai",
    "llm",
    "claude",
    "anthropic",
    "prepare-commit-msg",
    "git-hooks",
    "cli",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic (>=0.85.0,<1.0.0)",
    "typer (>=0.24.1,<1.0.0)",
    "keyring (>=25.7.0,<26.0.0)",
    "rich (>=13.0.0)",
    "openai (>=1.0.0,<2.0.0)",
]

[project.scripts]
noidea = "noidea.cli:app"

[project.urls]
Homepage = "https://github.com/AccursedGalaxy/noidea"
Repository = "https://github.com/AccursedGalaxy/noidea"
Documentation = "https://noidea.readthedocs.io"
Issues = "https://github.com/AccursedGalaxy/noidea/issues"
Changelog = "https://github.com/AccursedGalaxy/noidea/blob/main/CHANGELOG.md"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.3.1)",
    "isort (>=6.0.0,<7.0.0)",
    "pyright (>=1.1.0,<2.0.0)",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
# Match black, so a ruff-based editor or linter never re-wraps code to its default of 88.
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
