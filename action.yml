name: 'noidea — AI commit message suggestion'
description: >
  Generates an AI commit message suggestion for your PR diff and optionally
  posts it as a PR comment. Supports Anthropic, OpenAI, Ollama, Gemini,
  DeepSeek, and Groq — switching is a one-line input change.
author: 'AccursedGalaxy'

branding:
  icon: 'git-commit'
  color: 'blue'

inputs:
  api-key:
    description: >
      API key for the selected provider. Not required when provider is 'ollama'.
      Pass via a GitHub secret: ${{ secrets.ANTHROPIC_API_KEY }}
    required: false
    default: ''
  provider:
    description: >
      LLM provider to use. One of: anthropic (default), openai, ollama, gemini,
      deepseek, groq. Set to 'ollama' for a fully local, key-free run.
    required: false
    default: 'anthropic'
  model:
    description: >
      Override the model. Defaults to cost-aware auto-routing (small diff →
      cheap model, large diff → strong model). Example: 'claude-haiku-4-5'.
    required: false
    default: ''
  post-comment:
    description: >
      Post the suggested message as a PR comment. Set to 'false' to only
      expose the message via the commit-message output.
    required: false
    default: 'true'
  github-token:
    description: >
      GitHub token used to post PR comments. Defaults to the built-in
      GITHUB_TOKEN — only override if you need elevated permissions.
    required: false
    default: ${{ github.token }}

outputs:
  commit-message:
    description: 'The AI-suggested commit message for the PR diff.'
    value: ${{ steps.suggest.outputs.message }}

runs:
  using: 'composite'
  steps:
    - name: Install noidea
      shell: bash
      run: pip install noidea --quiet

    - name: Fetch base branch
      shell: bash
      run: git fetch origin ${{ github.base_ref }} --depth=1

    - name: Stage PR diff for noidea
      shell: bash
      # noidea suggest reads git diff --cached. We apply the PR diff to the
      # index so it sees exactly the changes introduced by this PR.
      run: |
        git diff origin/${{ github.base_ref }}...HEAD | git apply --cached --allow-empty 2>/dev/null || true

    - name: Generate commit message
      id: suggest
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        OPENAI_API_KEY: ${{ inputs.api-key }}
        GEMINI_API_KEY: ${{ inputs.api-key }}
        DEEPSEEK_API_KEY: ${{ inputs.api-key }}
        GROQ_API_KEY: ${{ inputs.api-key }}
        NOIDEA_PROVIDER: ${{ inputs.provider }}
        NOIDEA_MODEL: ${{ inputs.model }}
      run: |
        # Build minimal config for CI: provider and optional model override.
        mkdir -p .noidea
        PROVIDER="${{ inputs.provider }}"
        MODEL="${{ inputs.model }}"
        if [ -n "$MODEL" ]; then
          echo "{\"llm\":{\"provider\":\"$PROVIDER\",\"small_model\":\"$MODEL\",\"large_model\":\"$MODEL\"}}" > .noidea/config.json
        else
          echo "{\"llm\":{\"provider\":\"$PROVIDER\"}}" > .noidea/config.json
        fi

        # Capture stdout (the message) while letting stderr (routing notice) flow.
        MESSAGE=$(noidea suggest 2>/dev/null)
        echo "message<<EOF" >> "$GITHUB_OUTPUT"
        echo "$MESSAGE" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Restore index
      shell: bash
      # Unstage everything we applied so the working tree is clean for later steps.
      run: git reset HEAD --quiet 2>/dev/null || true

    - name: Post PR comment
      if: ${{ inputs.post-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        MESSAGE="${{ steps.suggest.outputs.message }}"
        if [ -z "$MESSAGE" ]; then
          echo "No message generated — skipping comment."
          exit 0
        fi
        BODY=$(printf '### 🤖 noidea commit message suggestion\n\n```\n%s\n```\n\n<sub>Generated by [noidea](https://github.com/AccursedGalaxy/noidea) · edit freely before merging</sub>' "$MESSAGE")
        gh pr comment ${{ github.event.pull_request.number }} --body "$BODY"
