name: 'noidea — AI commit message suggestion'
description: >-
  AI commit messages for your PR diffs. Posts as PR comments. Supports
  Anthropic, OpenAI, Ollama, Gemini, DeepSeek, Groq, and OpenRouter.
author: 'AccursedGalaxy'

branding:
  icon: 'git-commit'
  color: 'blue'

inputs:
  api-key:
    description: >
      API key for the selected provider. Not required when provider is 'ollama'.
      Pass via a GitHub secret: ${{ secrets.ANTHROPIC_API_KEY }}
    required: false
    default: ''
  provider:
    description: >
      LLM provider to use. One of: anthropic (default), openai, ollama, gemini,
      deepseek, groq, openrouter. 'ollama' needs no key, but it needs an Ollama
      server running inside the job.
    required: false
    default: 'anthropic'
  model:
    description: >
      Override the model. With the default anthropic provider, leaving this
      empty keeps cost-aware auto-routing (small diff → cheap model, large diff
      → strong model). Every other provider needs a model name here, e.g.
      'gpt-4o-mini' for openai.
    required: false
    default: ''
  post-comment:
    description: >
      Post the suggested message as a PR comment. Set to 'false' to only
      expose the message via the commit-message output.
    required: false
    default: 'true'
  github-token:
    description: >
      GitHub token used to post PR comments. Defaults to the built-in
      GITHUB_TOKEN — only override if you need elevated permissions.
    required: false
    default: ${{ github.token }}

outputs:
  commit-message:
    description: 'The AI-suggested commit message for the PR diff.'
    value: ${{ steps.suggest.outputs.message }}

runs:
  using: 'composite'
  steps:
    - name: Install noidea
      shell: bash
      run: pip install noidea --quiet

    - name: Fetch base branch
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: git fetch origin "$BASE_REF" --depth=1

    - name: Stage PR diff for noidea
      shell: bash
      # noidea suggest reads git diff --cached. We apply the PR diff to the
      # index so it sees exactly the changes introduced by this PR.
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        git diff "origin/$BASE_REF...HEAD" | git apply --cached --allow-empty 2>/dev/null || true

    - name: Generate commit message
      id: suggest
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        OPENAI_API_KEY: ${{ inputs.api-key }}
        GEMINI_API_KEY: ${{ inputs.api-key }}
        DEEPSEEK_API_KEY: ${{ inputs.api-key }}
        GROQ_API_KEY: ${{ inputs.api-key }}
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        # Inputs reach the script through env, never ${{ }} inside run, so no value is parsed
        # as shell code.
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
      run: |
        # The default models are Claude models, so any other provider needs an explicit one.
        if [ "$PROVIDER" != "anthropic" ] && [ -z "$MODEL" ]; then
          echo "::error::The '$PROVIDER' provider needs the 'model' input (e.g. gpt-4o-mini)."
          exit 1
        fi

        # Write the inputs as the runner's user-level config, not the repo's .noidea/config.json:
        # the checkout stays clean, and a repo config (e.g. a custom system_prompt) still applies
        # on top of it.
        python3 - <<'PY'
        import json, os
        llm = {"provider": os.environ["PROVIDER"]}
        if os.environ["MODEL"]:
            llm["small_model"] = llm["large_model"] = os.environ["MODEL"]
        os.makedirs(os.path.expanduser("~/.noidea"), exist_ok=True)
        with open(os.path.expanduser("~/.noidea/config.json"), "w") as handle:
            json.dump({"llm": llm}, handle)
        PY

        # stdout is only ever the message; errors and the routing notice go to stderr, which
        # stays in the job log. A failed suggestion warns instead of failing the PR's checks.
        if ! MESSAGE=$(noidea suggest); then
          echo "::warning::noidea could not generate a commit message; see the log above."
          MESSAGE=""
        fi
        # A random delimiter, so no line of model output can end the multi-line value early.
        DELIMITER="noidea_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        {
          echo "message<<$DELIMITER"
          echo "$MESSAGE"
          echo "$DELIMITER"
        } >> "$GITHUB_OUTPUT"

    - name: Restore index
      shell: bash
      # Unstage everything we applied so the working tree is clean for later steps.
      run: git reset HEAD --quiet 2>/dev/null || true

    - name: Post PR comment
      if: ${{ inputs.post-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # The message is model output derived from the PR diff, so it must never be expanded
        # by the shell; env passes it as plain data.
        MESSAGE: ${{ steps.suggest.outputs.message }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ -z "$MESSAGE" ]; then
          echo "No message generated — skipping comment."
          exit 0
        fi
        BODY=$(printf '### 🤖 noidea commit message suggestion\n\n```\n%s\n```\n\n<sub>Generated by [noidea](https://github.com/AccursedGalaxy/noidea) · edit freely before merging</sub>' "$MESSAGE")
        gh pr comment "$PR_NUMBER" --body "$BODY"
